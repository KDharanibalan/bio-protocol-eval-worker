[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-protocol-eval-worker"
version = "0.1.0"
description = "Reproducible AI Evaluation Harness & Human-in-the-Loop Protocol Compliance Digital Worker"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dharanibalan K., PhD", email = "dharanibalan.kasi@gmail.com"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
