name: CI-Release-Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  eval-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: PYTHONPATH=src pytest -v
      - name: Enforce AI Evaluation Release Gate
        run: PYTHONPATH=src python3 -m eval_worker.cli benchmark --enforce-gate
